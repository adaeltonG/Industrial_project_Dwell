  <text x="72" y="998" class="note" >PK = primary key    FK = foreign key    UK = unique    ? = nullable    1 → 0..* = one to zero or many</text>
  <text x="72" y="1025" class="note" >UserRole: USER, ADMIN    |    ProductAvailability: IN_STOCK, OUT_OF_STOCK, PREORDER</text>
  <text x="72" y="1052" class="note" >saved_products uses composite PK (user_id, product_id). Deleting a user or product cascades to its saved entries.</text>
  <text x="72" y="1079" class="note" >Deleting referenced vendors/categories is restricted. No database tables or columns were renamed.</text>
