services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: dwell
      POSTGRES_PASSWORD: dwell
      POSTGRES_DB: dwell
    ports:
      - "5432:5432"
    volumes:
      - dwell-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dwell -d dwell"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dwell-postgres:
